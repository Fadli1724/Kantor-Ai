const SK={Pixel:/desain|logo|poster|gambar|banner|visual|\bui\b/,Byte:/kode|coding|web|app|aplikasi|bug|program|script|fitur/,Nova:/tulis|copy|caption|artikel|konten|naskah|email|webinar|skrip/,Sage:/riset|cari|analis|data|tren|kompetitor|survei/,Echo:/customer|pelanggan|komplain|balas|\bcs\b|faq/,Ledger:/laporan|keuangan|invoice|budget|anggaran|biaya|pajak|tagihan/,Radar:/iklan|\bads\b|kampanye|campaign|promo|marketing|sosmed|instagram|tiktok|publikasi/};
const WORKER_URL='https://kantor-ai.fadli172409.workers.dev';/* isi dengan URL Cloudflare Worker kamu, contoh https://kantor-ai.namamu.workers.dev */
async function task(s){
 let items;
 if(WORKER_URL){try{rook('Sebentar Bos, aku susun rencananya dulu...');const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:s})});const j=await r.json();items=j.plan.filter(p=>bots.some(b=>b.name==p.agent&&b.i>0)).map(p=>({n:p.agent,t:String(p.task).slice(0,60),d:Math.min(25,Math.max(6,+p.seconds||10))}))}catch(e){log('Sistem','Backend tidak terjangkau, pakai mode lokal.')}}
 if(!items||!items.length){let names=Object.keys(SK).filter(n=>SK[n].test(s));if(!names.length)names=['Nova','Sage'];items=names.map(n=>({n,t:TXT[n],d:9+Math.random()*6}))}
 const ws=items.map(it=>bots.find(b=>b.name==it.n)),R0=bots[0];let left=ws.length;
 tgt.set(0,3,-3.5);rad=Math.min(rad,innerWidth<innerHeight?34:22);ph=.9;
 items.forEach(it=>{it.res={agent:it.n,task:it.t,status:'work',text:''};RES.unshift(it.res);it.done=false;
  if(WORKER_URL)fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'work',agent:it.n,task:it.t,text:s})}).then(r=>r.json()).then(j=>{it.res.text=j.result||j.error||'(kosong)'}).catch(()=>{it.res.text='Gagal mengambil hasil dari backend.'}).finally(()=>{it.res.status='done';it.done=true;rbadge()});
  else{it.res.text='Mode lokal: hasil asli butuh backend AI. Isi WORKER_URL dulu.';it.res.status='done';it.done=true}});
 rbadge();
 rook('Oke Bos Fadli. Aku pecah jadi '+ws.length+' tugas: '+items.map(it=>it.n+' '+it.t).join(', ')+'.');
 reset(R0);R0.busy=1;Q(R0,A.pc(R0,5,[{k:'say',x:'Rencana sudah aku bagi ke tim.'}]).concat([{k:'fn',fn:()=>R0.busy=0}]));
 ws.forEach((w,j)=>{reset(w);w.busy=1;const it=items[j],d=it.d;
  Q(w,[{k:'wait',d:3.5+j*.6},{k:'say',x:'Siap Rook, aku mulai: '+it.t+'.'},...A.pc(w,d,[{k:'until',f:()=>it.done},{k:'say',x:'Beres: '+it.t+' ✅ Cek tombol Hasil.'}]),
   {k:'fn',fn:()=>{w.busy=0;if(--left==0)rook('Bos Fadli, semua tugas sudah selesai ✅')}}])})}
function cmd(t){t=t.trim();if(!t)return;log('Bos Fadli',t);const s=t.toLowerCase();
 if(/lampu/.test(s)&&/(matikan|mati|padam|matiin)/.test(s))lightCmd(false);
 else if(/lampu/.test(s)&&/(nyala|hidup)/.test(s))lightCmd(true);
 else if(/istirahat|santai|rehat|break/.test(s))group('relax','Siap Bos, semua istirahat dulu.');
 else if(/sholat|salat|solat|ibadah/.test(s))group('pray','Siap Bos, waktunya ibadah. Gantian ya di musholla.');
 else if(/kopi|ngopi/.test(s))group('coffee','Siap Bos, semua ngopi dulu.');
 else if(/kerja|meja/.test(s)&&!Object.values(SK).some(r=>r.test(s)))group('work','Siap Bos, semua balik ke meja masing-masing.');
 else task(s)}
